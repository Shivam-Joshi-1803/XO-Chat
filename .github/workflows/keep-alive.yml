name: Keep Project Alive (Render & Supabase)

on:
  schedule:
    # Runs every 14 minutes to prevent Render Free Tier from sleeping (15-min idle timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual run from GitHub Actions UI

jobs:
  ping-render:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    environment: keep alive
    steps:
      - name: Ping Render Backend /api/health
        run: |
          if [ -z "${{ secrets.RENDER_SERVER_URL }}" ]; then
            echo "::notice ::RENDER_SERVER_URL secret is not set. Skipping Render ping."
            exit 0
          fi
          
          echo "Pinging Render backend at ${{ secrets.RENDER_SERVER_URL }}/api/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_SERVER_URL }}/api/health")
          
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Render backend is awake and healthy!"
          else
            echo "Warning: Render ping returned status $HTTP_STATUS"
          fi

  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    environment: keep alive
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::notice ::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set. Skipping Supabase ping."
            exit 0
          fi
          
          echo "Pinging Supabase at ${{ secrets.SUPABASE_URL }}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Supabase database ping successful!"
          else
            echo "Warning: Supabase ping returned status $HTTP_STATUS"
          fi
